<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAB-21170 final AI agent flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 900px; overflow: hidden; background: #fafaf7; }
    body { color: #051c2c; font-family: "Geist", Arial, sans-serif; }
    svg { display: block; width: 1280px; height: 900px; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1280 900" role="img" aria-labelledby="final-flow-title final-flow-desc">
    <title id="final-flow-title">Checkpoint 9 final AI agent caller path</title>
    <desc id="final-flow-desc">NewContact connects directly to AIAgent. Handled calls disconnect. On the configured escalation path, the caller hears EscalationMessage, enters HumanAgentQueue on Queue-1, then hears PlayMusic followed by PleaseWait in a loop while waiting. This path still needs a phone check. HumanAgentQueue errors play QueueErrorMessage before disconnecting. AIAgent errors play AgentErrorMessage before disconnecting.</desc>
    <defs>
      <marker id="blue-arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0 8 3.5 0 7Z" fill="#0672ef"/></marker>
      <marker id="cyan-arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0 8 3.5 0 7Z" fill="#007aa3"/></marker>
      <marker id="ink-arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0 8 3.5 0 7Z" fill="#59656b"/></marker>
    </defs>

    <rect width="1280" height="900" fill="#fafaf7"/>
    <text x="64" y="49" fill="#63727a" font-family="'Geist Mono', Menlo, monospace" font-size="10" font-weight="600" letter-spacing="1.8">CHECKPOINT 9 · REFERENCE TOPOLOGY</text>
    <text x="64" y="98" fill="#051c2c" font-family="'Instrument Serif', Georgia, serif" font-size="38">The AI agent owns the final caller path.</text>
    <text x="64" y="128" fill="#4e5a63" font-size="14">The order path passed a phone check. Verify the configured human queue and wait treatment by phone.</text>
    <line x1="64" y1="153" x2="1216" y2="153" stroke="#d9dcda"/>

    <!-- Connectors render under nodes. Each outcome is a separate Flow Designer output. -->
    <path d="M224 459H274" fill="none" stroke="#0672ef" stroke-width="2.3" marker-end="url(#blue-arrow)"/>
    <path d="M480 411H540Q548 411 548 403V260Q548 252 556 252H604" fill="none" stroke="#0672ef" stroke-width="2.1" marker-end="url(#blue-arrow)"/>
    <path d="M480 458H604" fill="none" stroke="#007aa3" stroke-width="2.1" marker-end="url(#cyan-arrow)"/>
    <path d="M480 505H540Q548 505 548 513V745Q548 753 556 753H604" fill="none" stroke="#59656b" stroke-width="1.9" marker-end="url(#ink-arrow)"/>
    <path d="M816 458H856" fill="none" stroke="#007aa3" stroke-width="2.1" marker-end="url(#cyan-arrow)"/>
    <path d="M1026 458H1054" fill="none" stroke="#007aa3" stroke-width="2.1" marker-end="url(#cyan-arrow)"/>
    <path d="M1138 511V526" fill="none" stroke="#007aa3" stroke-width="2.1" marker-end="url(#cyan-arrow)"/>
    <path d="M1216 558H1238V385H1138V400" fill="none" stroke="#007aa3" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#cyan-arrow)"/>
    <path d="M944 511V605" fill="none" stroke="#59656b" stroke-width="1.8" stroke-dasharray="3 6" stroke-linecap="round" marker-end="url(#ink-arrow)"/>
    <path d="M1026 646H1054" fill="none" stroke="#59656b" stroke-width="1.8" marker-end="url(#ink-arrow)"/>
    <path d="M816 753H856" fill="none" stroke="#59656b" stroke-width="1.8" marker-end="url(#ink-arrow)"/>

    <!-- Entry and AI agent. -->
    <rect x="64" y="403" width="160" height="112" rx="56" fill="#fff" stroke="#a9b2b5" stroke-width="1.4"/>
    <text x="144" y="453" fill="#051c2c" font-size="17" font-weight="600" text-anchor="middle">NewContact</text>
    <text x="144" y="480" fill="#68767d" font-family="'Geist Mono', Menlo, monospace" font-size="10" text-anchor="middle">voice start event</text>

    <rect x="280" y="381" width="200" height="156" rx="8" fill="#eaf4ff" stroke="#0672ef" stroke-width="2"/>
    <rect x="295" y="396" width="94" height="21" rx="4" fill="#0672ef"/>
    <text x="342" y="411" fill="#fff" font-family="'Geist Mono', Menlo, monospace" font-size="9" font-weight="600" text-anchor="middle">AUTONOMOUS</text>
    <text x="380" y="453" fill="#051c2c" font-size="22" font-weight="600" text-anchor="middle">AIAgent</text>
    <text x="380" y="481" fill="#4e5a63" font-size="13" text-anchor="middle">Virtual Agent V2</text>
    <text x="380" y="507" fill="#68767d" font-family="'Geist Mono', Menlo, monospace" font-size="9" text-anchor="middle">LAB-21170 Order Support</text>

    <!-- Handled ends the call. -->
    <rect x="610" y="192" width="82" height="21" rx="4" fill="#eaf4ff" stroke="#0672ef"/>
    <text x="651" y="207" fill="#0672ef" font-family="'Geist Mono', Menlo, monospace" font-size="9" font-weight="600" text-anchor="middle">HANDLED</text>
    <rect x="610" y="220" width="212" height="92" rx="46" fill="#fff" stroke="#9ca9ad" stroke-width="1.4"/>
    <text x="716" y="259" fill="#051c2c" font-size="17" font-weight="600" text-anchor="middle">DisconnectContact</text>
    <text x="716" y="284" fill="#68767d" font-size="12" text-anchor="middle">order request resolved</text>

    <!-- Escalated transfers to the configured queue, where wait treatment loops. -->
    <rect x="610" y="372" width="101" height="21" rx="4" fill="#eafbfe" stroke="#007aa3"/>
    <text x="660" y="387" fill="#006f94" font-family="'Geist Mono', Menlo, monospace" font-size="9" font-weight="600" text-anchor="middle">ESCALATED</text>
    <rect x="862" y="372" width="191" height="21" rx="4" fill="#eafbfe" stroke="#007aa3"/>
    <text x="957" y="387" fill="#006f94" font-family="'Geist Mono', Menlo, monospace" font-size="9" font-weight="600" text-anchor="middle">CONFIGURED · PHONE CHECK DUE</text>
    <rect x="610" y="407" width="206" height="103" rx="8" fill="#fff" stroke="#91bcc7" stroke-width="1.3"/>
    <text x="713" y="449" fill="#051c2c" font-size="17" font-weight="600" text-anchor="middle">EscalationMessage</text>
    <text x="713" y="475" fill="#68767d" font-size="12" text-anchor="middle">announce agent transfer</text>

    <rect x="862" y="407" width="164" height="103" rx="8" fill="#eafbfe" stroke="#007aa3" stroke-width="1.6"/>
    <rect x="875" y="420" width="60" height="19" rx="4" fill="#007aa3"/>
    <text x="905" y="434" fill="#fff" font-family="'Geist Mono', Menlo, monospace" font-size="9" font-weight="600" text-anchor="middle">QUEUE-1</text>
    <text x="944" y="470" fill="#051c2c" font-size="14" font-weight="600" text-anchor="middle">HumanAgentQueue</text>
    <text x="944" y="492" fill="#68767d" font-size="11" text-anchor="middle">Queue Contact activity</text>

    <rect x="1060" y="407" width="156" height="103" rx="8" fill="#fff" stroke="#91bcc7" stroke-width="1.3"/>
    <text x="1138" y="453" fill="#051c2c" font-size="17" font-weight="600" text-anchor="middle">PlayMusic</text>
    <text x="1138" y="478" fill="#68767d" font-size="11" text-anchor="middle">while caller waits</text>
    <text x="1138" y="494" fill="#68767d" font-size="11" text-anchor="middle">for an agent</text>

    <rect x="1060" y="532" width="156" height="52" rx="8" fill="#fff" stroke="#91bcc7" stroke-width="1.3"/>
    <text x="1138" y="564" fill="#051c2c" font-size="16" font-weight="600" text-anchor="middle">PleaseWait</text>

    <!-- Queue Contact failure uses a safe message and disconnect. -->
    <text x="870" y="590" fill="#68767d" font-family="'Geist Mono', Menlo, monospace" font-size="9">QUEUE ERROR</text>
    <rect x="862" y="611" width="164" height="70" rx="8" fill="#fff" stroke="#9ca9ad" stroke-width="1.3" stroke-dasharray="4 4"/>
    <text x="944" y="641" fill="#051c2c" font-size="14" font-weight="600" text-anchor="middle">QueueErrorMessage</text>
    <text x="944" y="665" fill="#68767d" font-size="11" text-anchor="middle">safe fallback</text>
    <rect x="1060" y="611" width="156" height="70" rx="35" fill="#fff" stroke="#9ca9ad" stroke-width="1.3"/>
    <text x="1138" y="642" fill="#051c2c" font-size="15" font-weight="600" text-anchor="middle">Disconnect</text>
    <text x="1138" y="665" fill="#68767d" font-size="11" text-anchor="middle">end failed route</text>

    <!-- Errored uses its own message and disconnect. -->
    <rect x="610" y="661" width="73" height="21" rx="4" fill="#f1f3f3" stroke="#9ca9ad"/>
    <text x="646" y="676" fill="#59656b" font-family="'Geist Mono', Menlo, monospace" font-size="9" font-weight="600" text-anchor="middle">ERRORED</text>
    <rect x="610" y="703" width="206" height="100" rx="8" fill="#fff" stroke="#a9b2b5" stroke-width="1.3"/>
    <text x="713" y="744" fill="#051c2c" font-size="17" font-weight="600" text-anchor="middle">AgentErrorMessage</text>
    <text x="713" y="771" fill="#68767d" font-size="12" text-anchor="middle">temporary agent failure</text>
    <rect x="862" y="703" width="164" height="100" rx="50" fill="#fff" stroke="#9ca9ad" stroke-width="1.3"/>
    <text x="944" y="747" fill="#051c2c" font-size="16" font-weight="600" text-anchor="middle">Disconnect</text>
    <text x="944" y="773" fill="#68767d" font-size="11" text-anchor="middle">end failed agent</text>

    <rect x="64" y="831" width="1152" height="49" rx="6" fill="#eaf4ff" stroke="#a8ccf8"/>
    <text x="87" y="861" fill="#051c2c" font-size="12" font-weight="600">Before publishing:</text>
    <text x="208" y="861" fill="#4e5a63" font-size="12">select the published agent, configure Queue-1, and connect Handled, Escalated, Errored, and HumanAgentQueue error.</text>
  </svg>
</body>
</html>
